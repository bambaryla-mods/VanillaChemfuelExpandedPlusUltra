<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ mod_name }}{% endblock %}</title>
<meta name="description" content="{% block description %}A RimWorld mod that adds refineries, pipe networks and automation to Vanilla Chemfuel Expanded.{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ mod_name }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:image" content="{{ site_url }}assets/preview.png">
<meta name="theme-color" content="#1b2838">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/css/site.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="index.html">VCE <span>Unofficial Expansion</span></a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="topnav">Menu</button>
  <nav id="topnav" class="topnav" aria-label="Sections">
    {% for group, entries in nav %}
    <a href="{{ entries[0][0] }}.html"{% if group == active_group %} class="on" aria-current="true"{% endif %}>{{ group }}</a>
    {% endfor %}
  </nav>
</header>
{% block body %}{% endblock %}
<footer class="footer">
  <p><a href="{{ workshop }}">Steam Workshop</a> · <a href="{{ github }}">GitHub</a></p>
  <p class="muted">The tables on this site are read from the mod's own files (RimWorld {{ game_version }}) each time it updates.</p>
</footer>
<script src="assets/js/site.js" defer></script>
</body>
</html>
